<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found — cartridge.homes</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#a3345a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151011" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#fbf8f7; --text:#251b1f; --muted:#6f5e65;
    --accent:#a3345a; --border:#e9dcd6;
    --sans:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151011; --text:#f3e9ec; --muted:#b7a4ab; --accent:#ec8fa9; --border:#33262a; }
  }
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;
    background:var(--bg);color:var(--text);
    font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  }
  main{max-width:30rem}
  .code{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(1.6rem,5vw,2.1rem);letter-spacing:-.03em;font-weight:680;margin:.35em 0 .4em}
  p{color:var(--muted);margin:0 0 22px}
  a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
  nav{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.92rem}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page isn’t here.</h1>
  <p>It may have moved, or the link may be wrong.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/privacy.html">Privacy Policy</a>
  </nav>
</main>
</body>
</html>
